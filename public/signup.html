<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge - Signup</title>

```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f7fb;
    }

    .signup-box {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    #message {
        text-align: center;
        margin-top: 15px;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
    }

    .modal-box {
        width: 350px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
    }

    .modal-box h3 {
        margin-bottom: 10px;
    }

    .modal-box p {
        margin-bottom: 15px;
        color: #555;
    }

    .close {
        background: #dc2626;
    }
</style>
```

</head>

<body>

```
<div class="signup-box">

    <h2>Create SkillBridge Account</h2>

    <form id="signupForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <select id="role">
            <option value="student">Student</option>
            <option value="college">College</option>
            <option value="company">Company</option>
        </select>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <p style="text-align:center; margin-top:20px;">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>


<!-- OTP POPUP -->

<div class="modal" id="otpModal">

    <div class="modal-box">

        <h3>Verify Your Email</h3>

        <p>
            Enter the 6-digit OTP sent to your email.
        </p>

        <input
            type="text"
            id="otp"
            placeholder="Enter OTP"
            maxlength="6"
        >

        <button type="button" onclick="verifyOTP()">
            Verify OTP
        </button>

        <button
            type="button"
            class="close"
            onclick="closeModal()">
            Cancel
        </button>

    </div>

</div>


<script src="./script.js"></script>
```

</body>
</html>
