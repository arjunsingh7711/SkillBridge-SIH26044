<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillBridge - Forgot Password</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f7fb;
    }

    .box {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 10px;
    }

    .description {
        text-align: center;
        color: #666;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    #message {
        text-align: center;
        margin-top: 15px;
    }

    .reset-section {
        display: none;
    }

    .back {
        text-align: center;
        margin-top: 20px;
    }

    .back a {
        color: #2563eb;
        text-decoration: none;
    }

</style>
```

</head>

<body>

```
<div class="box">

    <h2>Forgot Password?</h2>

    <p class="description">
        Enter your registered email to receive an OTP.
    </p>


    <!-- EMAIL SECTION -->

    <div id="emailSection">

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <button
            type="button"
            id="sendOtpBtn">
            Send OTP
        </button>

    </div>


    <!-- RESET PASSWORD SECTION -->

    <div
        id="resetSection"
        class="reset-section">

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
        >

        <input
            type="password"
            id="newPassword"
            placeholder="New Password"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
        >

        <button
            type="button"
            id="resetBtn">
            Reset Password
        </button>

    </div>


    <div id="message"></div>


    <div class="back">

        <a href="login.html">
            Back to Login
        </a>

    </div>

</div>


<script src="./forgot-password.js"></script>
```

</body>

</html>
